server:
  port: 8085

spring:
  application:
    name: matching-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerpilot}?currentSchema=matching
    username: ${DB_USER:matching_svc}
    password: ${DB_PASSWORD:matching_pw}
    hikari:
      maximum-pool-size: 10
      pool-name: matching-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: matching
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: matching
    default-schema: matching
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

careerpilot:
  search:
    # Home market for /matches/local and LOCAL-scoped skill-gap when no city is supplied.
    default-city: ${DEFAULT_CITY:Dhaka}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publishes histogram buckets for HTTP timings. Without these Prometheus only gets
      # count/sum/max, and histogram_quantile() cannot compute p95 -- the latency panel
      # would silently render "No data" rather than fail loudly.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  level:
    com.careerpilot: INFO
