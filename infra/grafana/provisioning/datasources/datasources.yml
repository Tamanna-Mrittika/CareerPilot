apiVersion: 1

# Provisioned automatically so the dashboards work on a fresh `docker compose up` with no
# clicking through the Grafana UI during a demo.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
